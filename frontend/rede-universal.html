<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-title="redeUniversalTitulo">
        Rede Universal
    </title>

    <link rel="stylesheet" href="css/rede-universal.css">

</head>

<body>

<header>

    <button
        class="voltar"
        id="btnVoltar">

        ←

    </button>

    <h1 data-lang="redeUniversalTitulo">
        Rede Universal
    </h1>

</header>

<main>

    <!-- BISPO -->

    <section class="bispo">

        <img
            src="images/PalavraAmiga.jpeg"
            alt="Bispo Macedo"
            class="bispo-img">

        <button
            class="telegram"
            id="telegramBtn"
            data-lang="telegramOficial">

            Telegram Oficial

        </button>

    </section>

    <!-- PORTAL UNIVERSAL -->

    <div class="section-title">

        <img
            src="images/rede-universal.png"
            alt="Portal Universal">

        <h2 data-lang="portalUniversal">
            Portal Universal
        </h2>

    </div>

    <div
        class="carousel"
        id="portal-carousel">

        <button
            class="prev"
            data-carousel="portal">

            &#10094;

        </button>

        <div
            class="carousel-track"
            id="portal-track">

            <!-- Banners inseridos pelo JavaScript -->

        </div>

        <button
            class="next"
            data-carousel="portal">

            &#10095;

        </button>

    </div>

    <div
        class="dots"
        id="portal-dots">

    </div>

    <!-- UNIVER VÍDEO -->

    <div class="section-title">

        <img
            src="images/univervideo.png"
            alt="Univer Vídeo">

        <h2 data-lang="univerVideo">
            Univer Vídeo
        </h2>

    </div>

    <div
        class="carousel"
        id="univer-carousel">

        <button
            class="prev"
            data-carousel="univer">

            &#10094;

        </button>

        <div
            class="carousel-track"
            id="univer-track">

            <!-- Banners inseridos pelo JavaScript -->

        </div>

        <button
            class="next"
            data-carousel="univer">

            &#10095;

        </button>

    </div>

    <div
        class="dots"
        id="univer-dots">

    </div>

    <!-- ARCA CENTER -->

    <div class="section-title">

        <img
            src="images/arcacenter.png"
            alt="Arca Center">

        <h2 data-lang="arcaCenter">
            Arca Center
        </h2>

    </div>

    <div
        class="carousel"
        id="arca-carousel">

        <button
            class="prev"
            data-carousel="arca">

            &#10094;

        </button>

        <div
            class="carousel-track"
            id="arca-track">

            <!-- Banners inseridos pelo JavaScript -->

        </div>

        <button
            class="next"
            data-carousel="arca">

            &#10095;

        </button>

    </div>

    <div
        class="dots"
        id="arca-dots">

    </div>

    <!-- PODCAST -->

    <section class="Podcast-section">

        <img
            src="images/fjucast.jpeg"
            alt="Podcast"
            class="Podcast-img">

        <button
            class="Podcast"
            id="PodcastBtn"
            data-lang="podcast">

            Podcast

        </button>

    </section>

    <!-- REDES SOCIAIS -->

    <section class="redes">

        <h2 data-lang="redesSociais">
            🌐 Redes Sociais
        </h2>

        <div
            class="social-box"
            id="instagram">

            <img
                src="images/instagram.png"
                alt="Instagram">

            <span data-lang="instagram">
                Instagram
            </span>

            <span class="arrow">
                ➜
            </span>

        </div>

        <div
            class="social-box"
            id="youtube">

            <img
                src="images/youtube.png"
                alt="YouTube">

            <span data-lang="youtube">
                YouTube
            </span>

            <span class="arrow">
                ➜
            </span>

        </div>

        <div
            class="social-box"
            id="facebook">

            <img
                src="images/facebook.png"
                alt="Facebook">

            <span data-lang="facebook">
                Facebook
            </span>

            <span class="arrow">
                ➜
            </span>

        </div>

    </section>

</main>

<script src="js/lang.js"></script>
<script src="js/idioma.js"></script>
<script src="js/rede-universal.js"></script>

</body>
</html>
