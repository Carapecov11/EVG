name: Backup EVG PostgreSQL

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node backend/backups.js